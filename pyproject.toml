[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "tmp_pdf_preview",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = "(^venv/|^\\.venv/|^tmp_pdf_preview/)"

[[tool.mypy.overrides]]
# Streamlit UI pages: widget and session_state types are too loose to check usefully
# yet (42 errors when this was added, none of them real bugs). Take modules off this
# list as they are cleaned up.
module = ["src.ui.*", "src.cover_letter.page"]
ignore_errors = true
